name: Runner 03
on:
  workflow_dispatch:

jobs:
  tunnel:
    runs-on: ubuntu-latest
    steps:
      - name: 安装 Chrome 和 Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq google-chrome-stable
          echo "✅ Chrome 安装完成"

      - name: 配置 SSH 并建立隧道
        env:
          SSH_KEY: ${{ secrets.HOME_SERVER_SSH_KEY }}
          HOME_IP: ${{ secrets.HOME_SERVER_IP }}
          HOME_USER: ${{ secrets.HOME_SERVER_USER }}
          RUNNER_ID: "03"
        run: |
          echo "🔑 设置 root 密码为: 123456"
          echo "root:123456" | sudo chpasswd
          
          echo "📝 配置 SSH 公钥..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat > ~/.ssh/authorized_keys << 'KEYEOF'
          ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICEm0GahqEojqUUrSlQMQDd0B/m7xdKGbMjZXBG3Aqta github-actions-tunnel
          KEYEOF
          chmod 600 ~/.ssh/authorized_keys
          
          echo "📝 开启密码登录..."
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/g' /etc/ssh/sshd_config
          sudo systemctl restart ssh 2>/dev/null || sudo service ssh restart 2>/dev/null
          
          echo "🎯 启动 Xvfb..."
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          export DISPLAY=:99
          
          echo "🔗 建立隧道 Runner-03 -> 端口 2203..."
          echo "$SSH_KEY" > /tmp/key && chmod 600 /tmp/key
          ssh -i /tmp/key -N -R 0.0.0.0:2203:localhost:22 \
              -o ServerAliveInterval=60 \
              -o ExitOnForwardFailure=yes \
              -o StrictHostKeyChecking=no \
              $HOME_USER@$HOME_IP
