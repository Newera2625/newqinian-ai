name: Runner 10
on:
  workflow_dispatch:

jobs:
  tunnel:
    runs-on: ubuntu-latest
    steps:
      - name: 建立反向SSH隧道
        env:
          SSH_KEY: ${{ secrets.HOME_SERVER_SSH_KEY }}
          HOME_IP: ${{ secrets.HOME_SERVER_IP }}
          HOME_USER: ${{ secrets.HOME_SERVER_USER }}
          RUNNER_ID: "10"
        run: |
          echo "$SSH_KEY" > /tmp/key && chmod 600 /tmp/key
          echo "🔗 建立隧道 Runner-10 -> 端口 2210"
          ssh -i /tmp/key -N -R 0.0.0.0:2210:localhost:22 \
              -o ServerAliveInterval=60 \
              -o ExitOnForwardFailure=yes \
              -o StrictHostKeyChecking=no \
              $HOME_USER@$HOME_IP
