name: Runner 08
on:
  workflow_dispatch:

jobs:
  tunnel:
    runs-on: ubuntu-latest
    steps:
      - name: 安装 Chrome 和 Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq google-chrome-stable
          echo "✅ Chrome 安装完成"

      - name: 配置 SSH 并建立隧道
        env:
          SSH_KEY: ${{ secrets.HOME_SERVER_SSH_KEY }}
          HOME_IP: ${{ secrets.HOME_SERVER_IP }}
          HOME_USER: ${{ secrets.HOME_SERVER_USER }}
          RUNNER_ID: "08"
        run: |
          # 1. 配置 SSH 目录
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # 2. 生成密钥对（用于免密登录自己）
          ssh-keygen -t ed25519 -f ~/.ssh/id_actions -N "" -q
          
          # 3. 授权自己登录自己
          cat ~/.ssh/id_actions.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          
          # 4. 配置跳板机密钥（连你家服务器）
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # 5. 修改 SSH 配置允许 root 登录
          sudo sed -i 's/^#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh 2>/dev/null || sudo service ssh restart 2>/dev/null
          
          # 6. 设置固定密码
          echo "root:123456" | sudo chpasswd
          
          # 7. 测试免密登录
          echo "测试本地免密登录..."
          ssh -o StrictHostKeyChecking=no -p 22 localhost -i ~/.ssh/id_actions "echo '✅ 免密登录成功'"
          
          echo "🎯 启动 Xvfb..."
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          export DISPLAY=:99
          
          echo "🔗 建立隧道 Runner-08 -> 端口 2208..."
          ssh -i ~/.ssh/id_rsa -N -R 0.0.0.0:2208:localhost:22 \
              -o ServerAliveInterval=60 \
              -o ExitOnForwardFailure=yes \
              -o StrictHostKeyChecking=no \
              $HOME_USER@$HOME_IP
